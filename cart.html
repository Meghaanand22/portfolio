  body { font-family: Arial, sans-serif; padding: 20px; }

  /* Add this block */
  .cart-page {
    background-image: url('assets/cart-bg.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-position: center;
    color: #fff;
  }

  h2 { color: #d63384; }
  .cart-item { margin: 10px 0; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
  .total { font-weight: bold; margin-top: 20px; }
  .buy-btn {
    background: #007bff; color: white; border: none;
    padding: 10px 20px; cursor: pointer; margin-top: 20px;
  }
</style>

  
</head>

     <body class="cart-page">

  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <p class="total">Total: <span id="total-price">₹0</span></p>
  <button class="buy-btn" onclick="placeOrder()">Buy Now</button>

  <script>
    function loadCart() {
      const cartItems = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cart-items");
      const totalSpan = document.getElementById("total-price");
      let total = 0;
      container.innerHTML = "";

      if (cartItems.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        document.querySelector(".buy-btn").style.display = "none";
        return;
      }

      cartItems.forEach(item => {
        const div = document.createElement("div");
        div.className = "cart-item";
        div.textContent = `${item.name} - ₹${item.price}`;
        container.appendChild(div);
        total += parseInt(item.price);
      });

      totalSpan.textContent = `₹${total}`;
    }

    function placeOrder() {
      const name = prompt("Enter your name:");
      const address = prompt("Enter your address:");
      if (name && address) {
        alert(`Thanks ${name}, your order has been placed to ${address}!`);
        localStorage.removeItem("cart");
        window.location.href = "index.html";
      }
    }

    window.onload = loadCart;
  </script>
 
  
</body>
</html>
